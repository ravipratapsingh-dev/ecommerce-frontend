<h2 class="title">🛒 My Cart</h2>

<!-- 🔥 ORDER SUCCESS -->
<div *ngIf="showOrderSuccess" class="success-box">
  <p>🎉 Order placed successfully!</p>

  <button (click)="goToOrders()">
    Check Order Details
  </button>
</div>

<!-- 🔥 EMPTY CART -->
<div *ngIf="cartItems.length === 0 && !showOrderSuccess" class="empty">
  <p>Cart is empty 😢</p>

  <button class="orders-btn" (click)="goToOrders()">
    📦 View Your Orders
  </button>
</div>

<!-- 🔥 NORMAL CART -->
<div *ngIf="cartItems.length > 0">

  <!-- CART LIST -->
  <div class="container">
    <div class="card" *ngFor="let item of cartItems">
      <div class="info">
        <h3>{{ item.name }}</h3>
        <p class="price">₹{{ item.price }}</p>
        <p class="qty">Qty: {{ item.quantity }}</p>
      </div>

      <div class="actions">
        <button (click)="remove(item.id)" class="remove-btn">
          ❌ Remove
        </button>
      </div>
    </div>
  </div>

  <!-- TOTAL -->
  <div class="total-box">
    Total: ₹{{ getTotal() }}
  </div>

  <!-- 🔥 ORDER SECTION FIXED -->
  <div class="order-section">

    <h3>📦 Delivery Details</h3>

    <div class="form-group">
      <input [(ngModel)]="address" placeholder="Enter address" />
    </div>

    <div class="form-group">
      <select [(ngModel)]="state">
        <option value="">Select State</option>
        <option *ngFor="let s of states" [value]="s">{{ s }}</option>
      </select>
    </div>

    <div class="form-group">
      <select [(ngModel)]="paymentMethod">
        <option value="COD">Cash On Delivery</option>
        <option value="ONLINE">Online Payment</option>
      </select>
    </div>

    <div class="form-group">
      <button class="order" (click)="placeOrder()">
        Place Order 🚀
      </button>
    </div>

  </div>

</div>
