<h2>Login</h2>

<input type="email" placeholder="Email" [(ngModel)]="email"><br><br>

<input type="password" placeholder="Password" [(ngModel)]="password"><br><br>

<button (click)="login()">Login</button>

<p>
  Don't have an account?
  <a (click)="goToRegister()" style="cursor:pointer; color:blue;">
    Register
  </a>
</p>
